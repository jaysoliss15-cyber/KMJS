name: Build KMJS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build KMJS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Show project files
        run: |
          echo "=== Repository ==="
          ls -la

          echo "=== Project files ==="
          find . -maxdepth 3 -type f | sort

      - name: Build KMJS
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK OUTPUTS ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KMJS-APK
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30      - name: Find APK
        run: find . -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KMJS-APK
          path: "**/*.apk"
          if-no-files-found: error
