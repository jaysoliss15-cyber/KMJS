name: KMJS V1 Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package KMJS V1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Build Environment
        run: |
          chmod +x gradlew
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK & NPatch/Xposed Module
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Package & Generate Artifact Metadata
        run: |
          set -euo pipefail
          ARTIFACT_DIR="KMJS-V1-artifacts"
          mkdir -p "$ARTIFACT_DIR/module"

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK output at $APK_PATH not found!" >&2
            exit 1
          fi

          # Copy main debug APK
          cp "$APK_PATH" "$ARTIFACT_DIR/app-debug.apk"

          # Copy module package for NPatch / LSPatch integration
          cp "$APK_PATH" "$ARTIFACT_DIR/module/kmjs-virtualcamera-module.apk"

          # Copy output metadata if present
          if [ -f "app/build/outputs/apk/debug/output-metadata.json" ]; then
            cp "app/build/outputs/apk/debug/output-metadata.json" "$ARTIFACT_DIR/"
          fi

          # Extract build details
          GRADLE_VER=$(./gradlew --version | grep 'Gradle ' | head -n 1 || echo "Gradle 9.3.1")
          JAVA_VER=$(java -version 2>&1 | head -n 1)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GIT_SHA="${GITHUB_SHA:-$(git rev-parse HEAD 2>/dev/null || echo 'local')}"
          GIT_BRANCH="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'main')}"
          APK_SIZE=$(du -h "$ARTIFACT_DIR/app-debug.apk" | awk '{print $1}')
          MODULE_SIZE=$(du -h "$ARTIFACT_DIR/module/kmjs-virtualcamera-module.apk" | awk '{print $1}')

          # Generate build-info.txt
          cat <<EOF > "$ARTIFACT_DIR/build-info.txt"
==================================================
KMJS V1 Build Information
==================================================
Project: KMJS Virtual Camera Module
Repository: https://github.com/jaysoliss15-cyber/KMJS
Branch: ${GIT_BRANCH}
Commit SHA: ${GIT_SHA}
Build Timestamp: ${TIMESTAMP}
Gradle Version: ${GRADLE_VER}
JDK Version: ${JAVA_VER}
Android Compile SDK: 36 (minor 1)
Android Target SDK: 36
Android Min SDK: 24
Package Name: com.kmjs.virtualcamera
Xposed Module: true (minversion 93)

==================================================
Artifact Outputs
==================================================
1. app-debug.apk (Size: ${APK_SIZE})
2. module/kmjs-virtualcamera-module.apk (Size: ${MODULE_SIZE})
EOF

          # Generate SHA-256 Checksums
          cd "$ARTIFACT_DIR"
          sha256sum app-debug.apk module/kmjs-virtualcamera-module.apk > checksums.txt
          cd ..

          echo "Generated Artifacts:"
          ls -la "$ARTIFACT_DIR"
          ls -la "$ARTIFACT_DIR/module"
          echo "Checksums:"
          cat "$ARTIFACT_DIR/checksums.txt"

      - name: Upload KMJS V1 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KMJS-V1-build
          path: KMJS-V1-artifacts/
          if-no-files-found: error
          retention-days: 14
