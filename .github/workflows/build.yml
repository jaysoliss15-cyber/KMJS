name: KMJS V1 Build & Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package KMJS V1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Build Environment
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew

          # Verify gradle-wrapper.jar validity; if corrupt/truncated, regenerate or download from official Gradle release
          if ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "WARNING: gradle-wrapper.jar is invalid or corrupted. Restoring valid Gradle 9.3.1 wrapper jar..."
            mkdir -p gradle/wrapper
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar || \
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v9.3.1/gradle/wrapper/gradle-wrapper.jar || \
            echo "Failed to download wrapper jar from standard sources"
          fi

          if [[ -f "debug.keystore.base64" && ! -f "debug.keystore" ]]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [[ ! -f ".env" && -f ".env.example" ]]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

      - name: Run Unit & Robolectric Tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace

      - name: Package & Generate Artifact Metadata
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_DIR="KMJS-V1-artifacts"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          mkdir -p "${ARTIFACT_DIR}/module"

          if [[ ! -f "${APK_PATH}" ]]; then
            echo "ERROR: Expected APK output not found:"
            echo "${APK_PATH}"
            exit 1
          fi

          echo "Copying debug APK..."
          cp "${APK_PATH}" "${ARTIFACT_DIR}/app-debug.apk"

          echo "Creating NPatch/LSPatch module artifact..."
          cp "${APK_PATH}" "${ARTIFACT_DIR}/module/kmjs-virtualcamera-module.apk"

          if [[ -f "app/build/outputs/apk/debug/output-metadata.json" ]]; then
            cp \
              "app/build/outputs/apk/debug/output-metadata.json" \
              "${ARTIFACT_DIR}/output-metadata.json"
          fi

          GRADLE_VER="$(./gradlew --version | awk '/Gradle / {print $2; exit}')"
          JAVA_VER="$(java -version 2>&1 | head -n 1)"
          TIMESTAMP="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          GIT_SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          GIT_BRANCH="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"

          APK_SIZE="$(du -h "${ARTIFACT_DIR}/app-debug.apk" | awk '{print $1}')"
          MODULE_SIZE="$(du -h "${ARTIFACT_DIR}/module/kmjs-virtualcamera-module.apk" | awk '{print $1}')"

          {
            echo "=================================================="
            echo "KMJS V1 Build Information"
            echo "=================================================="
            echo "Project: KMJS Virtual Camera Module"
            echo "Repository: https://github.com/jaysoliss15-cyber/KMJS"
            echo "Branch: ${GIT_BRANCH}"
            echo "Commit SHA: ${GIT_SHA}"
            echo "Build Timestamp: ${TIMESTAMP}"
            echo "Gradle Version: ${GRADLE_VER}"
            echo "JDK Version: ${JAVA_VER}"
            echo "Android Compile SDK: 36"
            echo "Android Target SDK: 36"
            echo "Android Min SDK: 24"
            echo "Package Name: com.kmjs.virtualcamera"
            echo "Xposed Module: true"
            echo "Xposed Minimum Version: 93"
            echo ""
            echo "=================================================="
            echo "Artifact Outputs"
            echo "=================================================="
            echo "1. app-debug.apk (Size: ${APK_SIZE})"
            echo "2. module/kmjs-virtualcamera-module.apk (Size: ${MODULE_SIZE})"
          } > "${ARTIFACT_DIR}/build-info.txt"

          (
            cd "${ARTIFACT_DIR}"
            sha256sum \
              app-debug.apk \
              module/kmjs-virtualcamera-module.apk \
              > checksums.txt
          )

          echo ""
          echo "Generated artifacts:"
          find "${ARTIFACT_DIR}" -maxdepth 2 -type f -print

          echo ""
          echo "Checksums:"
          cat "${ARTIFACT_DIR}/checksums.txt"

      - name: Upload KMJS V1 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KMJS-V1-build
          path: KMJS-V1-artifacts/
          if-no-files-found: error
          retention-days: 14
