name: Build KMJS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build KMJS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build KMJS
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e

          gradle :app:assembleDebug --stacktrace --no-daemon > build.log 2>&1

          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          echo "===== BUILD RESULT ====="
          echo "Exit code: $EXIT_CODE"

          echo ""
          echo "===== FAILED TASKS ====="
          grep -E "^> Task .*FAILED|Execution failed for task" build.log | tail -30 || true

          echo ""
          echo "===== COMPILER ERRORS ====="
          grep -E "e: |error: |ERROR:" build.log | tail -100 || true

          echo ""
          echo "===== WHAT WENT WRONG ====="
          grep -A 30 -B 5 "\* What went wrong:" build.log | tail -100 || true

          echo ""
          echo "===== CAUSED BY ====="
          grep -A 20 "Caused by:" build.log | tail -100 || true

          echo ""
          echo "===== LAST 150 LINES ====="
          tail -150 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KMJS-Build-Log
          path: build.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop if build failed
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "KMJS BUILD FAILED"
          exit 1

      - name: Find APK
        if: steps.build.outputs.exit_code == '0'
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: KMJS-APK
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30
