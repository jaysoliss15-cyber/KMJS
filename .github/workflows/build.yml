name: Build KMJS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build KMJS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build KMJS
        id: build
        continue-on-error: true
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Show actual Gradle error
        if: steps.build.outputs.BUILD_EXIT != '0'
        run: |
          echo "======================================"
          echo "KMJS BUILD FAILED"
          echo "======================================"

          echo ""
          echo "TASK/ERROR:"
          grep -E "^> Task |^FAILURE:|^\\* What went wrong:|^Caused by:|^Execution failed" build.log | tail -80 || true

          echo ""
          echo "LAST 150 LINES:"
          tail -150 build.log

          exit 1

      - name: Find APK
        run: |
          echo "APK FILES:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KMJS-APK
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30
