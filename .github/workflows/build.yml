name: Build KMJS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build KMJS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build KMJS
        run: |
          gradle assembleDebug --stacktrace > build.log 2>&1 || true

          echo "===== GRADLE TASKS ====="
          grep -E "^> Task " build.log || true

          echo ""
          echo "===== ERRORS ====="
          grep -E "e: |error: |ERROR:|FAILURE:|What went wrong|Execution failed|Caused by:" build.log | tail -100 || true

          echo ""
          echo "===== LAST 200 LINES ====="
          tail -200 build.log

          if grep -q "BUILD FAILED" build.log; then
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KMJS-Build-Log
          path: build.log
          retention-days: 7

      - name: Find APK
        if: success()
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KMJS-APK
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30
